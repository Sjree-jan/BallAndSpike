<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Unity WebGL Player | BallVsSpike</title>
  <!-- TON SDK + UI -->
  <script src="https://unpkg.com/@tonconnect/sdk@latest/dist/tonconnect-sdk.min.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  
  </style>
</head>
<body style="text-align: center; padding: 0; border: 0; margin: 0;">
  <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style="width: 960px; height: 600px; background: #231F20"></canvas>
  <!-- :white_check_mark: Hidden TON Connect button root (prevents crash) -->
  <div id="ton-ui-hidden" style="display: none;"></div>
  <!-- :white_check_mark: Initialize TON UI AFTER DOM is ready -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://sjree-jan.github.io/BallAndSpike/tonconnect-manifest.json',
        buttonRootId: 'ton-ui-hidden',
        actionsConfiguration: {
          showWalletsList: 'always'
        }
      });
    });
  </script>
  <!-- :white_check_mark: Unity Loader -->
  <script src="Build/Game.loader.js"></script>
  <script>
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.head.appendChild(meta);
      const canvas = document.querySelector("#unity-canvas");
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      canvas.style.position = "fixed";
      document.body.style.textAlign = "left";
    }
    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/Game.data",
      frameworkUrl: "Build/Game.framework.js",
      codeUrl: "Build/Game.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "BallVsSpike",
      productVersion: "1.0"
    }).then(instance => {
      window.UnityInstance = instance;
    });
  </script>

<script>
  async function verifyTONTransaction(txHash, expectedAddress, expectedAmount) {
    try {
      const res = await fetch(`https://tonapi.io/v2/blockchain/transactions/${txHash}`);
      const tx = await res.json();

      const valid =
        tx.in_msg?.source === expectedAddress &&
        tx.out_msgs?.some(m =>
          m.destination === "UQAok7FgjcsELOZW8VXEp_XGdg8sGprewxDzro7XvClatVaH" &&
          m.value === expectedAmount
        );

      const method = valid ? "OnVerificationSuccess" : "OnVerificationFailed";
      UnityInstance.SendMessage("TONWalletIntegration", method, txHash);
    } catch (err) {
      console.error("❌ Verification error:", err);
      UnityInstance.SendMessage("TONWalletIntegration", "OnVerificationFailed", txHash);
    }
  }
</script>

</body>
</html>
